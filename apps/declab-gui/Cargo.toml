# made by CasualArclamp
[package]
name = "declab-gui"
description = "DecLAB desktop GUI (egui): DVB, DAB and analog receivers as plug-in decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "declab-gui"
path = "src/main.rs"

[features]
# Both radio drivers are pure Rust over nusb (no SDKs, no DLLs), so both are on.
default = ["hackrf", "airspy"]
hackrf = ["declab-engine/hackrf"]
airspy = ["declab-engine/airspy"]

[dependencies]
declab-api = { path = "../../crates/declab-api" }
declab-decoders = { path = "../../crates/declab-decoders" }
declab-engine = { path = "../../crates/declab-engine" }
declab-io = { path = "../../crates/declab-io" }
# DVB: the TS tables and guide, the player (ffmpeg at run time) and its
# sound, the Red Button's MHEG-5 engine; DecDVB-T's, copied in.
decdvbt-core = { path = "../../crates/decdvbt-core" }
decdvbt-ts = { path = "../../crates/decdvbt-ts" }
decdvbt-video = { path = "../../crates/decdvbt-video" }
decdvbt-audio = { path = "../../crates/decdvbt-audio" }
decdvbt-mheg = { path = "../../crates/decdvbt-mheg" }
anyhow.workspace = true
# The glow (OpenGL) renderer instead of eframe's default wgpu, as in the
# other Dec apps. "x11"/"wayland" only matter on Linux.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native file dialogs (Win32 on Windows, XDG desktop portal on Linux).
rfd = "0.17.2"
# PNG output for --screenshot (documentation and smoke tests).
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The icon in the Windows exe (needs the SDK's rc.exe; without it a warning).
[build-dependencies]
winresource = "0.1"

# With eframe's defaults off, re-enable winit's (Linux only) so building needs
# no X11/Wayland dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
