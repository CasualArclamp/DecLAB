# made by CasualArclamp
[package]
name = "declab-cli"
description = "DecLAB command line: list the decoders, run one on a capture or a radio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "declab"
path = "src/main.rs"

[features]
# The HackRF, Airspy, RTL-SDR and Pluto drivers are pure Rust over nusb (no
# SDKs, no DLLs). The Fobos, SDRplay and USRP (UHD, Windows) ones load their
# maker's library at run time, so nothing is needed to build them either, and
# the remote link is plain TCP: all are on.
default = ["hackrf", "airspy", "rtlsdr", "pluto", "fobos", "sdrplay", "uhd", "remote"]
hackrf = ["declab-engine/hackrf"]
airspy = ["declab-engine/airspy"]
rtlsdr = ["declab-engine/rtlsdr"]
pluto = ["declab-engine/pluto"]
fobos = ["declab-engine/fobos"]
sdrplay = ["declab-engine/sdrplay"]
uhd = ["declab-engine/uhd"]
remote = ["declab-engine/remote"]

[dependencies]
declab-api = { path = "../../crates/declab-api", default-features = false }
declab-decoders = { path = "../../crates/declab-decoders", default-features = false }
declab-engine = { path = "../../crates/declab-engine" }
declab-io = { path = "../../crates/declab-io" }
anyhow.workspace = true

[dev-dependencies]
# For examples/dab_slides.rs, which runs DecDAB's receiver on every service.
decdab-ofdm = { path = "../../crates/decdab-ofdm" }
decdab-fic = { path = "../../crates/decdab-fic" }
decdab-msc = { path = "../../crates/decdab-msc" }
decdab-data = { path = "../../crates/decdab-data" }
