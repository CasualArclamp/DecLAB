# made by CasualArclamp
[package]
name = "declab-decoders"
description = "The decoders DecLAB ships with, and the list the app picks from"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["ui"]
ui = ["declab-api/ui", "dep:egui"]

[dependencies]
declab-api = { path = "../declab-api", default-features = false }
declab-dsp = { path = "../declab-dsp" }
num-complex.workspace = true
rustfft.workspace = true
# DVB-T/T2: DecDVB-T's receiver and TS tables (crates/decdvbt-*).
decdvbt-core = { path = "../decdvbt-core" }
decdvbt-rx = { path = "../decdvbt-rx" }
decdvbt-ofdm = { path = "../decdvbt-ofdm" }
decdvbt-ts = { path = "../decdvbt-ts" }
# POCSAG and FLEX (crates/declab-pagers, from DecPagers).
declab-pagers = { path = "../declab-pagers" }
# DMR (and later NXDN, P25, TETRA): crates/declab-pmr.
declab-pmr = { path = "../declab-pmr" }
# DAB/DAB+: DecDAB's receiver (crates/decdab-*), AAC by libxaac.
decdab-ofdm = { path = "../decdab-ofdm" }
decdab-fic = { path = "../decdab-fic" }
decdab-msc = { path = "../decdab-msc" }
decdab-codecs = { path = "../decdab-codecs" }
decdab-data = { path = "../decdab-data" }
# DVB-S/S2/S2X: DecSAT's receiver (crates/decsat-*).
decsat-core = { path = "../decsat-core" }
decsat-rx = { path = "../decsat-rx" }
decsat-frame = { path = "../decsat-frame" }
decsat-gse = { path = "../decsat-gse" }
decsat-ts = { path = "../decsat-ts" }
decsat-modem = { path = "../decsat-modem" }
egui = { workspace = true, optional = true }

[dev-dependencies]
decsat-mod = { path = "../decsat-mod" }
decsat-core = { path = "../decsat-core" }
decsat-gse = { path = "../decsat-gse" }
decsat-modem = { path = "../decsat-modem" }
